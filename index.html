<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inkwyrm</title>
<meta name="description" content="A fast, local-first markdown editor with live preview, neon syntax, and focus mode.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inkwyrm">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/editor.css">
<link rel="stylesheet" href="css/preview.css">
<style id="themeStyle"></style>
<style id="customStyle"></style>
</head>
<body class="mode-live">
<div id="app">
  <aside id="sidebar">
    <div class="sb-head">
      <div class="brand" title="Inkwyrm"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.4C9.5 4.8 6.6 4.4 3.4 5.1v13.4c3.2-.7 6.1-.3 8.6 1.3 2.5-1.6 5.4-2 8.6-1.3V5.1c-3.2-.7-6.1-.3-8.6 1.3z"/><path d="M12 6.4v13.4"/><path d="M6.2 9.4h3.1M6.2 12.2h3.1M6.2 15h2"/><path d="M15 8.8l2.6 1.7-2.6 1.7 2.6 1.7-2.6 1.7"/></svg><span class="bn">Ink<b>wyrm</b></span></div>
      <button class="icon-btn" id="newFolderBtn" title="New folder"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/></svg></button>
      <button class="icon-btn" id="newNoteBtn" title="New note"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="sb-search"><input id="search" class="field" type="search" placeholder="Search notes" autocomplete="off"></div>
    <div class="sb-tools">
      <select id="sort" class="field" title="Sort notes">
        <option value="recent">Recently edited</option>
        <option value="oldest">Oldest first</option>
        <option value="az">A to Z</option>
        <option value="za">Z to A</option>
      </select>
    </div>
    <div id="tagbar"></div>
    <div id="noteList" class="scroll"></div>
    <div class="sb-foot">
      <button class="btn" id="importBtn">Import</button>
      <button class="btn" id="trashHint" title="Deleted notes can be undone right after deleting">Shortcuts</button>
      <input type="file" id="importFile" accept=".md,.markdown,.txt,text/markdown,text/plain" multiple hidden>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button class="icon-btn" id="sbToggle" title="Toggle sidebar (⌘\)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
      <div class="brand tb-brand" title="Inkwyrm"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.4C9.5 4.8 6.6 4.4 3.4 5.1v13.4c3.2-.7 6.1-.3 8.6 1.3 2.5-1.6 5.4-2 8.6-1.3V5.1c-3.2-.7-6.1-.3-8.6 1.3z"/><path d="M12 6.4v13.4"/><path d="M6.2 9.4h3.1M6.2 12.2h3.1M6.2 15h2"/><path d="M15 8.8l2.6 1.7-2.6 1.7 2.6 1.7-2.6 1.7"/></svg><span class="bn">Ink<b>wyrm</b></span></div>
      <div id="noteTitle" title="Click to rename"></div>
      <span id="saved">Saved</span>
      <span class="spacer"></span>
      <div class="seg" id="modeSeg">
        <span class="thumb"></span>
        <button data-mode="live" title="Live preview">Live</button>
        <button data-mode="split" title="Split view">Split</button>
        <button data-mode="preview" title="Preview only">Read</button>
      </div>
      <button class="icon-btn hide-sm" id="focusBtn" title="Focus mode"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/></svg></button>
      <button class="icon-btn" id="shareBtn" title="Copy share link"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
      <button class="icon-btn" id="paletteBtn" title="Command palette (⌘K)"><svg viewBox="0 0 24 24"><path d="M9 6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3z"/></svg></button>
      <button class="icon-btn" id="settingsBtn" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </header>
    <div id="panes">
      <div id="edPane" class="pane"><div id="edScroll" class="scroll"><div id="editor"></div></div></div>
      <div id="divider" title="Drag to resize, double-click for 50/50"></div>
      <div id="pvPane" class="pane"><div id="pvScroll" class="scroll"><article id="preview" class="preview"></article></div></div>
    </div>
    <footer id="statusbar">
      <button id="stat" title="Click to switch"></button>
      <div id="goal" title="Daily writing goal"><div class="bar"><i></i></div><span></span></div>
      <span class="spacer"></span>
      <span id="savedMini">Saved</span>
      <span id="vimMode"></span>
      <span id="soundInd" title="Typewriter sounds on" hidden>♪</span>
    </footer>
  </main>
</div>

<div id="palette" class="overlay">
  <div class="pal" role="dialog" aria-label="Command palette">
    <input id="palInput" placeholder="Type a command or note name…" autocomplete="off" spellcheck="false">
    <div id="palList" class="pal-list scroll"></div>
    <div class="pal-foot"><span>↑↓ navigate</span><span>↵ run</span><span>esc close</span></div>
  </div>
</div>

<div id="themeGallery" class="overlay">
  <div class="tg" role="dialog" aria-label="Themes">
    <div class="tg-head">
      <b>Themes</b>
      <div class="tg-target" id="tgTarget"><button data-t="both">Whole app</button><button data-t="editor">Editor override</button><button data-t="preview">Preview override</button></div>
      <span class="spacer"></span>
      <button class="icon-btn" id="tgClose" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="tg-grid scroll" id="tgGrid"></div>
  </div>
</div>

<aside id="settings" aria-label="Settings">
  <div class="set-head"><span style="flex:1">Settings</span><button class="icon-btn" id="settingsClose" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="set-body scroll" id="settingsBody"></div>
</aside>

<div id="shareView">
  <div class="share-bar">
    <div class="brand" title="Inkwyrm"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.4C9.5 4.8 6.6 4.4 3.4 5.1v13.4c3.2-.7 6.1-.3 8.6 1.3 2.5-1.6 5.4-2 8.6-1.3V5.1c-3.2-.7-6.1-.3-8.6 1.3z"/><path d="M12 6.4v13.4"/><path d="M6.2 9.4h3.1M6.2 12.2h3.1M6.2 15h2"/><path d="M15 8.8l2.6 1.7-2.6 1.7 2.6 1.7-2.6 1.7"/></svg><span class="bn">Ink<b>wyrm</b></span></div>
    <span class="note">Shared note · read only</span>
    <span class="spacer"></span>
    <button class="btn" id="sharePrint">Print</button>
    <button class="btn primary" id="shareDup">Duplicate to my notes</button>
  </div>
  <article id="sharePreview" class="preview"></article>
</div>

<div id="toasts"></div>
<div id="updateBanner"><span>A new version is ready.</span><button class="btn primary" id="updateBtn">Reload</button><button class="icon-btn" id="updateDismiss" title="Later"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<div id="dropZone">Drop .md or .txt files to import</div>
<div id="ctxMenu"></div>

<script src="js/util.js"></script>
<script src="js/highlight.js"></script>
<script src="js/math.js"></script>
<script src="js/markdown.js"></script>
<script src="js/mdline.js"></script>
<script src="js/editor.js"></script>
<script src="js/gutter.js"></script>
<script src="js/vim.js"></script>
<script src="js/store.js"></script>
<script src="js/themes.js"></script>
<script src="js/welcome.js"></script>
<script src="js/app.js"></script>
<script src="js/io.js"></script>
<script src="js/commands.js"></script>
<script src="js/settings.js"></script>
<script src="js/gallery.js"></script>
<script src="js/topbar.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
